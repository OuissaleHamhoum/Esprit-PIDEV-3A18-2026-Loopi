<!DOCTYPE html>
<html>
<head>
    <title>Test API Events</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 10px; }
        #results { margin-top: 20px; padding: 10px; border: 1px solid #ccc; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Test API Events</h1>
    <button onclick="testOrganisateurEvents()">Test Organisateur Events (GET)</button>
    <button onclick="testAdminEvents()">Test Admin Events (GET)</button>
    <button onclick="testCreateEvent()">Test Create Event (POST)</button>
    <button onclick="testHealth()">Test Health Check</button>
    <div id="results"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        async function testHealth() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                document.getElementById('results').innerHTML = 'Health Check:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').innerHTML = 'Health Check Error: ' + error.message;
            }
        }

        async function testOrganisateurEvents() {
            try {
                const response = await fetch(`${API_BASE}/api/organisateur/events`);
                const data = await response.json();
                document.getElementById('results').innerHTML = 'Organisateur Events:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').innerHTML = 'Organisateur Events Error: ' + error.message;
            }
        }

        async function testAdminEvents() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/events`);
                const data = await response.json();
                document.getElementById('results').innerHTML = 'Admin Events:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').innerHTML = 'Admin Events Error: ' + error.message;
            }
        }

        async function testCreateEvent() {
            try {
                const response = await fetch(`${API_BASE}/api/organisateur/events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        titre: 'Test Event ' + Date.now(),
                        description: 'Test description for the event with enough characters to pass validation',
                        date_evenement: '2026-12-25',
                        heure_evenement: '14:30',
                        lieu: 'Test Location',
                        capacite_max: 100
                    })
                });
                const data = await response.json();
                document.getElementById('results').innerHTML = 'Create Event:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').innerHTML = 'Create Event Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
